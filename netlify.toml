[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls through Netlify (same-origin) to avoid CORS without redeploying backend
[[redirects]]
  from = "/api/*"
  to = "https://coffeeshop-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://coffeeshop-backend-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

# React Router SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
